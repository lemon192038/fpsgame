<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Iron Dusk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no">
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0b0e12;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,system-ui,sans-serif;color:#fff}
canvas{display:block;position:fixed;inset:0}
#ui{position:fixed;inset:0;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.b{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.05em;backdrop-filter:blur(4px)}
.b.on{background:rgba(255,255,255,.35)}
#fire{right:28px;bottom:36px;width:104px;height:104px;border-color:#ff6a3d;background:rgba(255,106,61,.25)}
#jump{right:150px;bottom:30px;width:68px;height:68px}
#rel{right:36px;bottom:158px;width:62px;height:62px}
#ads{right:112px;bottom:112px;width:62px;height:62px}
#joy{left:36px;bottom:40px;width:140px;height:140px}
#knob{position:absolute;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.4);left:41px;top:41px}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;opacity:.85}
#cross:before{left:8px;top:0;width:2px;height:18px;-webkit-mask:linear-gradient(#000 35%,transparent 35% 65%,#000 65%)}
#cross:after{top:8px;left:0;height:2px;width:18px;-webkit-mask:linear-gradient(90deg,#000 35%,transparent 35% 65%,#000 65%)}
#hud{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;font-weight:700;text-shadow:0 1px 4px #000;pointer-events:none}
#hp{width:180px;height:8px;background:rgba(0,0,0,.5);margin-top:6px;border-radius:4px;overflow:hidden}#hpf{height:100%;width:100%;background:#7bd88f}
#dmg{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 160px 30px rgba(200,0,0,.9);opacity:0;transition:opacity .4s}
#hit{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border:2px solid #fff;transform:rotate(45deg);opacity:0;pointer-events:none}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,8,12,.78);text-align:center;gap:10px}
#msg h1{margin:0;font-size:44px;letter-spacing:.2em;font-weight:800}#msg p{margin:0;opacity:.8;max-width:420px;line-height:1.5}
#menu{position:absolute;inset:0;overflow:auto;touch-action:pan-y;display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 16px;background:rgba(5,8,12,.94);text-align:center}
#menu h1{margin:0;font-size:40px;letter-spacing:.2em}.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:640px}
.opt{min-height:44px;padding:0 16px;display:flex;align-items:center;border:1px solid rgba(255,255,255,.4);border-radius:10px;background:rgba(255,255,255,.08);font-weight:600;font-size:15px}
.opt.sel{background:#ff6a3d;border-color:#ff6a3d}.opt.go{background:#2f7d4f;border-color:#2f7d4f;font-size:17px}.opt.off{opacity:.35}
#room{height:40px;border-radius:8px;border:1px solid #888;background:#111;color:#fff;padding:0 10px;font-size:16px;text-align:center}
#kill{position:absolute;left:0;right:0;top:60%;text-align:center;font-size:68px;font-weight:900;letter-spacing:.3em;color:#ff3b30;text-shadow:0 0 28px rgba(255,59,48,.9);opacity:0;pointer-events:none}
#kill.show{animation:k 1.1s ease-out}@keyframes k{0%{opacity:0;transform:scale(2.4)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.9)}}
body.kb .b,body.kb #joy{display:none}#ctlr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
#jz{position:absolute;left:0;bottom:0;width:35%;height:72%}body.kb #jz{display:none}#joy{pointer-events:none}
html{-webkit-text-size-adjust:100%}#abar{position:absolute;right:18px;top:80px;width:240px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px;pointer-events:none}#abar i{display:block;background-size:contain;background-repeat:no-repeat;background-position:center}#abar i.u{opacity:.18;filter:grayscale(1)}
html{overflow:hidden;overscroll-behavior:none}body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
</style></head><body>
<div id="ui">
 <div id="hud"><div><div id="score">WAVE 1 · 0 KILLS</div><div id="hp"><div id="hpf"></div></div></div><div id="ammo" style="font-size:28px">30 / ∞</div></div>
 <div id="cross"></div><div id="hit"></div><div id="dmg"></div>
 <div id="jz"></div><div class="b" id="joy"><div id="knob"></div></div>
 <div class="b" id="fire">FIRE</div><div class="b" id="jump">JUMP</div><div class="b" id="rel">RELOAD</div><div class="b" id="ads">AIM</div><div class="b" id="crc" style="right:232px;bottom:36px;width:62px;height:62px">CROUCH</div><div class="b" id="swp" style="right:186px;bottom:104px;width:62px;height:62px">SWAP</div><div id="wname" style="position:absolute;right:18px;top:48px;font-weight:700;text-shadow:0 1px 4px #000;pointer-events:none"></div><div id="abar"></div>
 <div id="kill">KILL</div><div id="dmgin" style="position:absolute;left:50%;top:56%;transform:translateX(-50%);color:#ff5a4a;font:800 26px sans-serif;text-shadow:0 1px 4px #000;opacity:0;transition:opacity .3s;pointer-events:none"></div><div class="b" id="mbtn" style="left:50%;top:44px;width:46px;height:46px;margin-left:-23px;font-size:11px">MENU</div>
<div id="menu"><h1>IRON DUSK</h1><div class="row" id="langr"></div><div id="acct"></div><div class="row" id="modes"></div><div class="row" id="lvs"></div>
<div class="row" id="mapr"></div><div class="row" id="ctlr"></div><div class="row" id="wrow"></div><div class="row"><div class="opt go" id="pcpu">PLAY vs CPU</div><div class="opt go" id="ponl">PLAY ONLINE</div><div class="opt go" id="pqm">QUICK MATCH</div></div><input id="room" value="lobby" maxlength="16" aria-label="room"></div>
<div id="msg" style="display:none"><h1>IRON DUSK</h1><p>Left stick: move · Drag right side of screen: look · FIRE / AIM / JUMP / RELOAD buttons. Survive the waves.</p><p><b>Tap to deploy</b></p></div>
</div>
